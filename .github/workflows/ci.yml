name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push to a PR cancels the previous run; main runs are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustup show && cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy --locked --workspace --all-targets -- \
            -D warnings \
            -A clippy::should_implement_trait \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity \
            -A clippy::vec_init_then_push \
            -A clippy::doc_lazy_continuation

      - name: Test
        run: cargo test --locked --workspace

      # pinned: the differential tests record this version's behaviour
      - name: Install Z3
        env:
          Z3_VERSION: "4.15.4"
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/Z3Prover/z3/releases/tags/z3-$Z3_VERSION" \
                | grep -o 'https://[^"]*x64-glibc[^"]*\.zip' | head -1)
          test -n "$url" || { echo "no x64-glibc asset for z3-$Z3_VERSION"; exit 1; }
          curl -sSL -o z3.zip "$url"
          unzip -q z3.zip
          sudo install z3-*/bin/z3 /usr/local/bin/z3

      # the solver-backed tests are #[ignore]d so `cargo test` stays hermetic
      - name: Test (solver-backed)
        run: |
          z3 --version
          cargo test --locked --workspace -- --ignored
