name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup honours rust-toolchain.toml, so the toolchain and its components
      # install on the first cargo invocation.
      - name: Show toolchain
        run: rustup show && cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all -- --check

      # -D warnings gates against *new* lint classes. The five allowed below are
      # the ones the tree ships with today: the first three are deliberate --
      # the DSL mirrors SMT operator names (`add`, `sub`, ...) on its own types
      # and the backend passes wide contexts around. The last two are trivial
      # nits; fix them and delete the -A lines.
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- \
            -D warnings \
            -A clippy::should_implement_trait \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity \
            -A clippy::vec_init_then_push \
            -A clippy::doc_lazy_continuation

      - name: Test
        run: cargo test --workspace
