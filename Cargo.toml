[workspace]
members = [
    "utils",
    "smt/stdlib",
    "smt/remark",
    "smt/remark/remark_derive",
    "smt/derive",
    "evaluation",
    "lang",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.99"
command-group = "5.0.1"
datatest-stable = "0.3.2"
lazy_static = "1.5.0"
log = "0.4.27"
num_cpus = "1.17.0"
petgraph = "0.8.2"
proc-macro2 = "1.0.101"
quote = "1.0.40"
syn = { version = "2.0.106", features = ["full", "extra-traits"] }
tempfile = "3.21.0"
simplelog = "0.12.2"
walkdir = "2.5.0"
bitvec = "1.0.1"
internment = { version = "0.8.4", features = ["arc"] }
itertools = "0.14.0"
num-bigint = "0.4.6"
num-rational = "0.4.2"
num-traits = "0.2.19"
paste = "1"
ordered-float = "5.1.0"
clap = { version = "4.5.48", features = ["derive"] }
z3     = { path = "solver/z3.rs/z3"}
z3-sys = { path = "solver/z3.rs/z3-sys"}

rusmart-utils = { path = "utils" }
rusmart-smt-stdlib = { path = "smt/stdlib" }
rusmart-smt-remark = { path = "smt/remark" }
rusmart-smt-remark-derive = { path = "smt/remark/remark_derive" }
rusmart-smt-derive = { path = "smt/derive" }
