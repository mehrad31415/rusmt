[package]
name = "rusmart-evaluation"
version = "0.1.0"
authors = ["Meng Xu <meng.xu.cs@uwaterloo.ca>", "Mehrad Haghshenas <m3haghsh@uwaterloo.ca>"]
description = "Test suites for the SMT component"
license = "GPL-3.0-or-later"
keywords = ["smt", "testing"]
categories = ["compilers", "development-tools::testing"]
edition = "2024"
homepage = "https://github.com/meng-xu-cs/rusmart"
repository = "https://github.com/meng-xu-cs/rusmart.git"

[dev-dependencies]
anyhow = { workspace = true }
datatest-stable = { workspace = true }
tempfile = { workspace = true }

rusmart-utils = { workspace = true }
rusmart-smt-stdlib = { workspace = true }
rusmart-smt-remark-derive = { workspace = true }
rusmart-smt-derive = { workspace = true }

[lints.rust]
non_camel_case_types = "allow"
unused = "allow"

[lints.clippy]
all = "allow"

[[test]]
name = "integration"
harness = false