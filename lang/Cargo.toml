[package]
name = "rusmart-lang"
version = "0.1.0"
authors = ["Meng Xu <meng.xu.cs@uwaterloo.ca>", "Mehrad Haghshenas <m3haghsh@uwaterloo.ca>"]
description = "Declarative semantics for languages"
license = "GPL-3.0-or-later"
keywords = ["declarative semantics", "interpreters", "program verification"]
categories = ["compilers"]
edition = "2024"
homepage = "https://github.com/meng-xu-cs/rusmart"
repository = "https://github.com/meng-xu-cs/rusmart.git"

[dependencies]
anyhow = { workspace = true }
walkdir = { workspace = true }
syn = { workspace = true }
z3 = { workspace = true }
z3-sys = { workspace = true }

rusmart-utils = { workspace = true }
rusmart-smt-stdlib = { workspace = true }
rusmart-smt-remark-derive = { workspace = true }
rusmart-smt-derive = { workspace = true }
