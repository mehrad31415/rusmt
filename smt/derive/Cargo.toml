[package]
name = "rusmt-smt-derive"
version.workspace = true
description = "SMT model derivation from Rust code"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["smt", "model", "derivation"]
categories = ["compilers", "parser-implementations"]
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
num-bigint = { workspace = true }
num-rational = { workspace = true }
anyhow = { workspace = true }
command-group = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
tempfile = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
walkdir = { workspace = true }
num_cpus = { workspace = true }
lazy_static = { workspace = true }
rusmt-lang = { workspace = true }
rusmt-smt-stdlib = { workspace = true }

# Paper tooling, not a framework feature: it scores a drafted semantics against a
# reference suite, which only makes sense when both exist. Lives beside the paper.
[[example]]
name = "evaluate_draft"
path = "../../specops/evaluate_draft.rs"
