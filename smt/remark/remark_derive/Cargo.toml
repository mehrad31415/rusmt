[package]
name = "rusmt-smt-remark-derive"
version.workspace = true
description = "The #[smt_type] and #[smt_fn] attribute macros for constraining Rust code destined for SMT"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["smt", "annotation", "macros"]
categories = ["compilers", "development-tools::procedural-macro-helpers"]
edition.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
syn = { workspace = true }
rusmt-smt-remark = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }